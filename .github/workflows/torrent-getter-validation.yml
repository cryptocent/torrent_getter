name: Torrent Getter validation

on:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate Python syntax
        run: python -m compileall -q app.py db.py qbit_client.py scraper.py jobs.py
      - name: Validate all Jinja templates
        run: |
          python - <<'PY'
          from pathlib import Path
          from jinja2 import Environment
          env = Environment()
          for path in Path("templates").glob("*.html"):
              env.parse(path.read_text(encoding="utf-8"))
              print(f"PASS {path}")
          PY
      - name: Validate browser JavaScript syntax
        run: node --check static/qbit_send.js
      - name: Run tests
        run: python -m pytest -q
