name: Validate media full stack

on:
  push:
    branches:
      - feature/full-stack-setup
      - full-stack-setup
    paths:
      - "full-stack/**"
      - ".github/workflows/validate-media-stack.yml"
  pull_request:
    paths:
      - "full-stack/**"
      - ".github/workflows/validate-media-stack.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate installer syntax
        run: |
          bash -n full-stack/setup.sh
          bash -n full-stack/setup-network-shares.sh
      - name: Validate Compose configuration
        run: |
          cp full-stack/.env.example full-stack/.env
          docker compose --project-directory full-stack --env-file full-stack/.env -f full-stack/compose.yml config --quiet
      - name: Verify expected services
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          cmd = [
              "docker", "compose", "--project-directory", "full-stack",
              "--env-file", "full-stack/.env", "-f", "full-stack/compose.yml",
              "config", "--format", "json"
          ]
          config = json.loads(subprocess.check_output(cmd, text=True))
          expected = {
              "jellyfin", "jellyseerr", "radarr", "sonarr", "prowlarr",
              "torrent_getter", "iqbit", "qbittorrent", "bazarr",
              "uptime-kuma", "fastchannels",
          }
          assert set(config["services"]) == expected, set(config["services"]) ^ expected
          assert config["services"]["torrent_getter"]["build"]["context"].endswith("/torrent_getter")
          assert "http://qbittorrent:8080" == config["services"]["iqbit"]["environment"]["QBIT_HOST"]
          for name in ("jellyfin", "radarr", "sonarr", "qbittorrent", "bazarr"):
              mounts = config["services"][name]["volumes"]
              network = [m for m in mounts if m["target"] == "/network"]
              assert len(network) == 1, name
              assert network[0]["bind"]["propagation"] == "rslave", name
              assert network[0]["source"] == "/mnt/media-shares", name
          for name in ("jellyfin", "radarr", "sonarr", "qbittorrent", "bazarr"):
              assert all("/data" not in m["target"] for m in config["services"][name]["volumes"]), name
          assert any(m["target"] == "/downloads" for m in config["services"]["qbittorrent"]["volumes"])
          print(f"Validated {len(expected)} services and offline-safe network mounts.")
          PY
