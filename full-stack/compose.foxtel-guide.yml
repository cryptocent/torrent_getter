# Explicit opt-in override. Never changes the base media stack.
# Run: docker compose -f compose.yml -f compose.foxtel-guide.yml up -d --build foxtel-guide
services:
  foxtel-guide:
    build: ./foxtel-guide
    environment:
      TZ: "${TZ:-Australia/Melbourne}"
      FOXTEL_GUIDE_FEED_TOKEN: "${FOXTEL_GUIDE_FEED_TOKEN:?Set a strong local feed token in full-stack/.env}"
      FOXTEL_GUIDE_SOURCE: "${FOXTEL_GUIDE_SOURCE:-https://i.mjh.nz/Foxtel/epg.xml.gz}"
      FOXTEL_GUIDE_REFRESH_SECONDS: "${FOXTEL_GUIDE_REFRESH_SECONDS:-21600}"
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${FOXTEL_GUIDE_PORT:-8765}:8765"
    volumes:
      - "${CONFIG_ROOT:-./config}/foxtel-guide:/data:ro"
    restart: unless-stopped
    networks: [media]
